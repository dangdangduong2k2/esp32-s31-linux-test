name: Build ESP32-S31 Linux
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bash bc bison flex gawk git wget curl cpio unzip rsync file patch perl tar gzip bzip2 xz-utils zstd libssl-dev libncurses-dev python3 python3-venv python3-dev python3-setuptools swig device-tree-compiler
      - name: Build pinned official sources
        run: bash scripts/build.sh
      - name: Preserve image and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: esp32-s31-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: warn
          retention-days: 30
